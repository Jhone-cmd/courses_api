spring.application.name=courses_api

# Database

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Tokens 

security.token=${SECURITY_TOKEN}

security.key.public=${SECURITY_KEY_PUBLIC}

security.key.private=${SECURITY_KEY_PRIVATE}

token.sonar=${TOKEN_SONAR}

# Monitoring

management.endpoints.access.default=unrestricted
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.access=read-only
management.endpoint.health.show-details=always
management.endpoint.metrics.access=read-only
management.endpoint.prometheus.access=read-only